name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'jarp/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and quality
        run: ./mvnw -B -Pquality clean verify
